<div id="search-modal" hidden role="dialog" aria-modal="true" aria-labelledby="search-input">
    <div class="search-backdrop" onclick="closeSearch()"></div>
    <div class="search-box">
        <div class="search-header">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-search" width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z"/>
                <circle cx="10" cy="10" r="7" />
                <line x1="21" y1="21" x2="15" y2="15" />
            </svg>
            <input id="search-input" type="text" placeholder="Search for posts, tags, or categories..." aria-label="Search" autocomplete="off" />
            <div class="search-controls">
                <span id="search-clear" aria-label="Clear search" title="Clear search" style="display: none; cursor: pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
                <kbd onclick="closeSearch()">ESC</kbd>
            </div>
        </div>
        <div id="search-results"></div>
        <div class="search-footer">
            <div id="search-count" class="search-hint" style="margin-right: auto; display: none;"></div>
            <div class="search-hint">
                <kbd>↵</kbd> <span>select</span>
            </div>
            <div class="search-hint">
                <kbd>↑</kbd><kbd>↓</kbd> <span>navigate</span>
            </div>
            <div class="search-hint">
                <kbd>ESC</kbd> <span>close</span>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --search-modal-z-index: 9999;
        --search-result-hover: var(--card-background-selected);
        --search-input-focus-glow: rgba(var(--accent-color-rgb, 52, 73, 94), 0.1);
    }

    #search-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: var(--search-modal-z-index);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
        font-family: var(--base-font-family);
    }

    #search-modal[hidden] {
        display: none;
    }

    .search-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .search-box {
        position: relative;
        width: 90%;
        max-width: 650px;
        background: var(--card-background);
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04), var(--shadow-l2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--card-separator-color);
        animation: search-appear 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes search-appear {
        from { opacity: 0; transform: translateY(-16px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .search-header {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--card-separator-color);
        gap: 12px;
        transition: box-shadow 0.2s ease;
    }

    .search-header:focus-within {
        box-shadow: inset 0 -2px 0 0 var(--accent-color);
    }

    .search-header .icon-tabler-search {
        opacity: 0.5;
        color: var(--body-text-color);
    }

    .search-header input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--card-text-color-main);
        font-size: 1.1rem;
        font-family: inherit;
    }

    .search-header input::placeholder {
        font-weight: 300;
        opacity: 0.6;
    }

    .search-controls {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .search-header kbd {
        background: var(--body-background);
        border: 1px solid var(--card-separator-color);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 0.7rem;
        color: var(--body-text-color);
        box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        cursor: pointer;
        font-weight: 600;
    }

    #search-results {
        max-height: 65vh;
        overflow-y: auto;
        padding: 12px 0;
        min-height: 120px;
        background: var(--card-background);
    }

    #search-results::-webkit-scrollbar {
        width: 6px;
    }
    #search-results::-webkit-scrollbar-track {
        background: transparent;
    }
    #search-results::-webkit-scrollbar-thumb {
        background: var(--card-separator-color);
        border-radius: 10px;
    }
    #search-results::-webkit-scrollbar-thumb:hover {
        background: var(--body-text-color);
        opacity: 0.3;
    }

    .search-section-header {
        padding: 12px 24px 8px;
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--accent-color);
        opacity: 0.8;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .search-section-header:first-child {
        padding-top: 4px;
    }

    .search-result-item {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        padding: 12px 20px;
        margin: 4px 12px;
        text-decoration: none;
        color: var(--card-text-color-main);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        gap: 14px;
        border-radius: 8px;
        border: 1px solid transparent;
    }

    .search-result-item.selected {
        background: var(--search-result-hover);
        border-color: var(--card-separator-color);
        transform: translateX(4px);
    }

    .search-result-icon {
        padding-top: 4px;
        color: var(--body-text-color);
        opacity: 0.4;
    }

    .search-result-item.selected .search-result-icon {
        color: var(--accent-color);
        opacity: 1;
    }

    .search-result-content {
        flex: 1;
        min-width: 0;
    }

    .search-result-item .breadcrumb {
        font-size: 0.7rem;
        color: var(--card-text-color-secondary);
        opacity: 0.6;
        margin-bottom: 2px;
        font-weight: 500;
    }

    .search-result-item .title {
        font-weight: 600;
        font-size: 1.05rem;
        color: var(--card-text-color-main);
        margin: 0 0 4px 0;
        line-height: 1.3;
    }

    .search-result-item.selected .title {
        color: var(--accent-color);
    }

    .search-result-item .summary {
        font-size: 0.85rem;
        color: var(--card-text-color-secondary);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        opacity: 0.8;
    }

    .search-result-item mark {
        background-color: rgba(var(--accent-color-rgb, 52, 73, 94), 0.15);
        color: var(--accent-color);
        padding: 1px 4px;
        border-radius: 3px;
        text-decoration: none;
        font-weight: 600;
    }

    .search-empty {
        padding: 60px 20px;
        text-align: center;
        color: var(--card-text-color-tertiary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    .search-empty svg {
        opacity: 0.2;
        margin-bottom: 8px;
    }

    .search-empty strong {
        color: var(--card-text-color-secondary);
    }

    .search-footer {
        display: flex;
        padding: 10px 20px;
        background: var(--body-background);
        border-top: 1px solid var(--card-separator-color);
        gap: 15px;
        justify-content: flex-end;
        align-items: center;
    }

    .search-hint {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.7rem;
        color: var(--body-text-color);
        opacity: 0.6;
    }

    .search-hint kbd {
        background: var(--card-background);
        border: 1px solid var(--card-separator-color);
        border-radius: 3px;
        padding: 0 4px;
        min-width: 18px;
        height: 18px;
        line-height: 16px;
        text-align: center;
        color: var(--card-text-color-main);
        font-size: 0.65rem;
        box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        font-weight: 700;
    }

    @media (max-width: 640px) {
        #search-modal {
            padding-top: 0;
        }
        .search-box {
            width: 100%;
            height: 100%;
            max-width: none;
            border-radius: 0;
            border: none;
        }
        .search-footer {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .search-header kbd {
            display: none;
        }
        .search-result-item {
            margin: 4px 8px;
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
    (function() {
        let fuse;
        const modal = document.getElementById('search-modal');
        const input = document.getElementById('search-input');
        const resultsContainer = document.getElementById('search-results');
        const clearBtn = document.getElementById('search-clear');
        const countDisplay = document.getElementById('search-count');
        let selectedIndex = -1;
        let searchData = null;

        const docIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="search-result-icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /><path d="M9 17h6" /><path d="M9 13h6" /></svg>`;
        const searchIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-search"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="10" cy="10" r="7" /><line x1="21" y1="21" x2="15" y2="15" /></svg>`;
        const emptyIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-mood-empty"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="9" /><line x1="9" y1="10" x2="9.01" y2="10" /><line x1="15" y1="10" x2="15.01" y2="10" /><path d="M9 15h6" /></svg>`;

        // Pre-fetch index
        function initFuse() {
            if (searchData) return Promise.resolve();
            return fetch('/index.json')
                .then(res => res.json())
                .then(data => {
                    searchData = data;
                    fuse = new Fuse(data, {
                        keys: [
                            { name: 'title', weight: 0.7 },
                            { name: 'summary', weight: 0.2 },
                            { name: 'content', weight: 0.1 }
                        ],
                        threshold: 0.3,
                        includeMatches: true,
                        ignoreLocation: true,
                        minMatchCharLength: 2
                    });
                })
                .catch(err => {
                    console.error("Failed to load search index:", err);
                    resultsContainer.innerHTML = `<div class="search-empty">${emptyIcon}Error loading search index</div>`;
                });
        }

        // Initialize on idle
        if ('requestIdleCallback' in window) {
            requestIdleCallback(() => initFuse());
        } else {
            setTimeout(initFuse, 2000);
        }

        window.openSearch = function() {
            modal.hidden = false;
            document.body.style.overflow = 'hidden';
            input.value = '';
            clearBtn.style.display = 'none';
            countDisplay.style.display = 'none';
            resultsContainer.innerHTML = `<div class="search-empty">${searchIcon}<span>Type to start searching...</span></div>`;
            selectedIndex = -1;
            setTimeout(() => input.focus(), 100);
            
            if (!searchData) {
                initFuse();
            }
        };

        window.closeSearch = function() {
            modal.hidden = true;
            document.body.style.overflow = '';
        };

        // Hijack any links to /search/
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.getAttribute('href')) {
                const href = link.getAttribute('href');
                if (href.endsWith('/search/') || href.endsWith('/search') || href.includes('/search/?')) {
                    e.preventDefault();
                    openSearch();
                }
            }
        });

        // Clear button functionality
        clearBtn.onclick = function() {
            input.value = '';
            input.focus();
            clearBtn.style.display = 'none';
            countDisplay.style.display = 'none';
            resultsContainer.innerHTML = `<div class="search-empty">${searchIcon}<span>Type to start searching...</span></div>`;
            selectedIndex = -1;
        };

        document.addEventListener('keydown', (e) => {
            const isMac = navigator.platform.toUpperCase().includes('MAC');
            const isK = e.key.toLowerCase() === 'k';
            const isSlash = e.key === '/';
            const isModifier = isMac ? e.metaKey : e.ctrlKey;

            // Ctrl+K or Cmd+K or / to open
            if ((isModifier && isK) || (isSlash && modal.hidden && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) {
                e.preventDefault();
                openSearch();
                return;
            }
            
            // Just 'k' to open (only if not in an input and modal is hidden)
            if (isK && modal.hidden && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                openSearch();
                return;
            }

            if (e.key === 'Escape' && !modal.hidden) {
                closeSearch();
            }
        });

        let debounceTimer;
        input.addEventListener('input', (e) => {
            const query = e.target.value;
            clearBtn.style.display = query ? 'block' : 'none';

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (!query) {
                    countDisplay.style.display = 'none';
                    resultsContainer.innerHTML = `<div class="search-empty">${searchIcon}<span>Type to start searching...</span></div>`;
                    return;
                }
                if (!fuse) return;

                const results = fuse.search(query).slice(0, 15);
                renderResults(results, query);
            }, 100);
        });

        function highlight(text, matches, key) {
            if (!matches) return text;
            const match = matches.find(m => m.key === key);
            if (!match) return text;

            let result = "";
            let lastIndex = 0;
            const indices = match.indices.sort((a, b) => a[0] - b[0]);

            for (const [start, end] of indices) {
                result += text.substring(lastIndex, start) + "<mark>" + text.substring(start, end + 1) + "</mark>";
                lastIndex = end + 1;
            }
            result += text.substring(lastIndex);
            return result;
        }

        function renderResults(results, query) {
            if (results.length === 0) {
                countDisplay.style.display = 'none';
                resultsContainer.innerHTML = `<div class="search-empty">${emptyIcon}<span>No results for "<strong>${query}</strong>"</span></div>`;
                return;
            }

            countDisplay.innerText = `${results.length} result${results.length > 1 ? 's' : ''} found`;
            countDisplay.style.display = 'flex';

            // Group by section
            const groups = {};
            results.forEach((r, i) => {
                const section = r.item.section || 'Other';
                if (!groups[section]) groups[section] = [];
                groups[section].push({ result: r, index: i });
            });

            let html = '';
            Object.keys(groups).forEach(section => {
                html += `<div class="search-section-header">${section.toUpperCase()}</div>`;
                groups[section].forEach(item => {
                    const r = item.result;
                    const i = item.index;
                    const title = highlight(r.item.title, r.matches, 'title');
                    const summary = highlight(r.item.summary || r.item.content.substring(0, 100), r.matches, 'summary') || 
                                    highlight(r.item.content.substring(0, 100), r.matches, 'content');

                    html += `
                        <a href="${r.item.permalink}" class="search-result-item" data-index="${i}">
                            <div class="search-result-icon">${docIcon}</div>
                            <div class="search-result-content">
                                <div class="breadcrumb">${section}</div>
                                <div class="title">${title}</div>
                                <div class="summary">${summary}...</div>
                            </div>
                        </a>
                    `;
                });
            });

            resultsContainer.innerHTML = html;
            selectedIndex = -1;
        }

        // Keyboard navigation
        input.addEventListener('keydown', (e) => {
            const items = resultsContainer.querySelectorAll('.search-result-item');
            if (items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = (selectedIndex + 1) % items.length;
                updateSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                updateSelection(items);
            } else if (e.key === 'Enter') {
                if (selectedIndex >= 0) {
                    e.preventDefault();
                    items[selectedIndex].click();
                } else if (items.length > 0) {
                    e.preventDefault();
                    items[0].click();
                }
            }
        });

        function updateSelection(items) {
            items.forEach((item, i) => {
                if (i === selectedIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }
    })();
</script>
