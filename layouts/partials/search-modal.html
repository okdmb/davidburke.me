<div id="search-modal" hidden role="dialog" aria-modal="true" aria-labelledby="search-input">
    <div class="search-backdrop" onclick="closeSearch()"></div>
    <div class="search-box">
        <div class="search-header">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-search" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z"/>
                <circle cx="10" cy="10" r="7" />
                <line x1="21" y1="21" x2="15" y2="15" />
            </svg>
            <input id="search-input" type="text" placeholder="Search..." aria-label="Search" />
            <kbd onclick="closeSearch()">ESC</kbd>
        </div>
        <div id="search-results"></div>
    </div>
</div>

<style>
    #search-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
    }
    #search-modal[hidden] {
        display: none;
    }
    .search-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
    }
    .search-box {
        position: relative;
        width: 90%;
        max-width: 600px;
        background: var(--card-background);
        border-radius: var(--card-border-radius);
        box-shadow: var(--shadow-l);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border-color);
    }
    .search-header {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border-color);
        gap: 15px;
    }
    .search-header input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--body-text-color);
        font-size: 1.2rem;
        font-family: inherit;
    }
    .search-header kbd {
        background: var(--background);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 0.8rem;
        color: var(--body-text-color);
        cursor: pointer;
    }
    #search-results {
        max-height: 60vh;
        overflow-y: auto;
        padding: 10px 0;
    }
    .search-result-item {
        display: block;
        padding: 12px 20px;
        text-decoration: none;
        color: var(--body-text-color);
        border-bottom: 1px solid var(--border-color);
        transition: background 0.2s;
    }
    .search-result-item:last-child {
        border-bottom: none;
    }
    .search-result-item:hover, .search-result-item.selected {
        background: var(--background);
    }
    .search-result-item .title {
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 4px;
        display: block;
        color: var(--accent-color);
    }
    .search-result-item .summary {
        font-size: 0.9rem;
        opacity: 0.8;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    @media (max-width: 640px) {
        #search-modal {
            padding-top: 5vh;
        }
        .search-box {
            width: 95%;
        }
        .search-header {
            padding: 12px 15px;
            gap: 10px;
        }
        .search-header input {
            font-size: 1rem;
        }
        .search-header kbd {
            display: none; /* Hide ESC hint on mobile */
        }
        .search-result-item {
            padding: 10px 15px;
        }
        .search-result-item .title {
            font-size: 1rem;
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
    let fuse;
    const modal = document.getElementById('search-modal');
    const input = document.getElementById('search-input');
    const resultsContainer = document.getElementById('search-results');
    let selectedIndex = -1;

    function openSearch() {
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        input.value = '';
        resultsContainer.innerHTML = '';
        selectedIndex = -1;
        setTimeout(() => input.focus(), 100);
        
        if (!fuse) {
            fetch('/index.json')
                .then(res => res.json())
                .then(data => {
                    fuse = new Fuse(data, {
                        keys: ['title', 'content', 'summary'],
                        threshold: 0.3
                    });
                });
        }
    }

    function closeSearch() {
        modal.hidden = true;
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        const isMac = navigator.platform.toUpperCase().includes('MAC');
        if ((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            openSearch();
        }
        if (e.key === 'Escape' && !modal.hidden) {
            closeSearch();
        }
    });

    let debounceTimer;
    input.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            const query = e.target.value;
            if (!query || !fuse) {
                resultsContainer.innerHTML = '';
                return;
            }

            const results = fuse.search(query).slice(0, 10);
            renderResults(results);
        }, 150);
    });

    function renderResults(results) {
        if (results.length === 0) {
            resultsContainer.innerHTML = '<div style="padding: 20px; text-align: center;">No results found</div>';
            return;
        }
        resultsContainer.innerHTML = results.map((r, i) => `
            <a href="${r.item.permalink}" class="search-result-item" data-index="${i}">
                <div class="title">${r.item.title}</div>
                <div class="summary">${r.item.summary}</div>
            </a>
        `).join('');
        selectedIndex = -1;
    }

    // Keyboard navigation
    input.addEventListener('keydown', (e) => {
        const items = resultsContainer.querySelectorAll('.search-result-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = (selectedIndex + 1) % items.length;
            updateSelection(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            updateSelection(items);
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
            e.preventDefault();
            items[selectedIndex].click();
        }
    });

    function updateSelection(items) {
        items.forEach((item, i) => {
            if (i === selectedIndex) {
                item.classList.add('selected');
                item.scrollIntoView({ block: 'nearest' });
            } else {
                item.classList.remove('selected');
            }
        });
    }
</script>
