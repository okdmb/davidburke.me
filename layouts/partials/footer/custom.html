<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Font Switcher ---
        const fontSelect = document.getElementById('font-select');
        const setFont = (font) => {
            if (font === 'default') {
                delete document.documentElement.dataset.font;
                localStorage.removeItem('font');
            } else {
                document.documentElement.dataset.font = font;
                localStorage.setItem('font', font);
            }
        };

        // Initialize from localStorage
        const storedFont = localStorage.getItem('font');
        if (storedFont) {
            setFont(storedFont);
            if (fontSelect) fontSelect.value = storedFont;
        }

        if (fontSelect) {
            fontSelect.addEventListener('change', (e) => {
                setFont(e.target.value);
            });
        }

        // --- Animations Toggle ---
        const animationsToggle = document.getElementById('animations-toggle');
        const setAnimations = (state) => {
            if (state === 'on') {
                document.documentElement.dataset.animations = 'on';
                localStorage.setItem('animations', 'on');
            } else {
                delete document.documentElement.dataset.animations;
                localStorage.setItem('animations', 'off');
            }
        };

        // Initialize from localStorage (default to off)
        const storedAnimations = localStorage.getItem('animations');
        if (storedAnimations === 'on') {
            setAnimations('on');
        } else {
            setAnimations('off');
        }

        if (animationsToggle) {
            animationsToggle.addEventListener('click', () => {
                const currentState = document.documentElement.dataset.animations === 'on' ? 'off' : 'on';
                setAnimations(currentState);
            });
        }

        // --- Scroll to Top ---
        const scrollBtn = document.getElementById('scroll-to-top');
        if (scrollBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollBtn.classList.add('show');
                } else {
                    scrollBtn.classList.remove('show');
                }
            });

            scrollBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }

        // --- Page Transitions (Fade Out) ---
        const links = document.querySelectorAll('a');
        links.forEach(link => {
            // Only handle internal links that aren't anchors/new tabs
            if (link.hostname === window.location.hostname && 
                !link.hash && 
                link.target !== '_blank') {
                
                link.addEventListener('click', (e) => {
                    // Don't intercept if modifier keys are pressed
                    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

                    e.preventDefault();
                    const targetUrl = link.href;
                    document.body.classList.add('fade-out');

                    // Navigate after animation finishes
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 300);
                });
            }
        });
    });

    // Handle back/forward cache to ensure fade-in runs again
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            document.body.classList.remove('fade-out');
        }
    });
</script>
