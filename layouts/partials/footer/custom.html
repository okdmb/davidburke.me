<script>
    document.addEventListener('DOMContentLoaded', () => {
        const mql = window.matchMedia('(max-width: 768px)');
        const toggle = document.getElementById('dark-mode-toggle');
        const mainMenu = document.getElementById('main-menu');
        const toggleMenuBtn = document.getElementById('toggle-menu');
        const sidebar = document.querySelector('.left-sidebar');
        const menuBottomSection = document.querySelector('.menu-bottom-section');

        if (!toggle) return;

        // Store original inline styles to restore them when moving back to desktop
        const originalStyles = {
            position: toggle.style.position,
            right: toggle.style.right,
            top: toggle.style.top,
            display: toggle.style.display,
            padding: toggle.style.padding,
            zIndex: toggle.style.zIndex
        };

        function handleMobileChange(e) {
            if (!toggle) return;

            if (e.matches) {
                // Mobile layout
                // Move out of main menu, put it into the sidebar container
                if (sidebar) {
                    sidebar.appendChild(toggle);
                    
                    // Style it to sit in the header next to the hamburger
                    toggle.style.position = 'absolute';
                    toggle.style.right = '70px'; // Give adequate space for the hamburger
                    toggle.style.top = '15px'; // Align vertically
                    toggle.style.display = 'flex';
                    toggle.style.padding = '0';
                    toggle.style.zIndex = '10'; // Ensure it's clickable above header contents
                    toggle.style.flexDirection = 'row-reverse'; // Put text to the left of the icon
                    
                    // Show the text label and add spacing
                    const textSpan = toggle.querySelector('span');
                    if(textSpan) {
                        textSpan.style.display = '';
                        textSpan.style.marginRight = '8px';
                    }
                }
            } else {
                // Desktop layout
                // Move back to main menu before the bottom section
                if (mainMenu && menuBottomSection) {
                    mainMenu.insertBefore(toggle, menuBottomSection);
                    
                    // Restore original styling
                    toggle.style.position = originalStyles.position;
                    toggle.style.right = originalStyles.right;
                    toggle.style.top = originalStyles.top;
                    toggle.style.display = originalStyles.display;
                    toggle.style.padding = originalStyles.padding;
                    toggle.style.zIndex = originalStyles.zIndex;
                    toggle.style.flexDirection = ''; // Reset flex direction
                    
                    // Restore text label formatting
                    const textSpan = toggle.querySelector('span');
                    if(textSpan) {
                        textSpan.style.display = '';
                        textSpan.style.marginRight = '';
                    }
                }
            }
        }

        // Initial check
        handleMobileChange(mql);

        // Listen for resize events
        mql.addEventListener('change', handleMobileChange);
    });
</script>
