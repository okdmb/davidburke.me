{{ if .Params.Tags }}
    <section class="article-tags">
        {{ range (.GetTerms "tags") }}
            {{ $color := partial "helper/color-from-str" .LinkTitle }}
            <a href="{{ .RelPermalink }}" style="--tag-hue: {{ $color.Hue }};">{{ .LinkTitle }}</a>
        {{ end }}
    </section>
{{ end }}
